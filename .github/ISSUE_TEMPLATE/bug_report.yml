name: Bug report
description: Report a reproducible plugin problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Clear WordPress, CDN and browser caches before reporting display problems.

  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: "2.0"
    validations:
      required: true

  - type: input
    id: wordpress-version
    attributes:
      label: WordPress version
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP version
    validations:
      required: true

  - type: input
    id: theme
    attributes:
      label: Theme
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the image type, page context and exact result.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true

  - type: textarea
    id: cache
    attributes:
      label: Caching/CDN setup
      placeholder: "WP Rocket, Cloudflare APO, LiteSpeed Cache, none, etc."
