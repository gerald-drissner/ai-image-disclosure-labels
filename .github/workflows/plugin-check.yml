name: WordPress Plugin Check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP and WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: wp-cli

      - name: Install WP-CLI dist-archive command
        run: wp package install wp-cli/dist-archive-command:3.1.0

      - name: Build production plugin package
        run: |
          rm -rf build
          rm -f ai-image-disclosure-labels.zip

          wp dist-archive . ./ai-image-disclosure-labels.zip \
            --plugin-dirname=ai-image-disclosure-labels \
            --force

          mkdir -p build
          unzip -q ai-image-disclosure-labels.zip -d build

          echo "Files included in the checked package:"
          find build/ai-image-disclosure-labels -maxdepth 3 -type f | sort

      - name: Run WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './build/ai-image-disclosure-labels'

      - name: Upload tested plugin package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-image-disclosure-labels
          path: ./ai-image-disclosure-labels.zip
          if-no-files-found: error
