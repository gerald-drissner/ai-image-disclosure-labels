name: WordPress Plugin Check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build WordPress.org plugin ZIP
        uses: 10up/action-wordpress-plugin-build-zip@stable
        with:
          retention-days: 7
        env:
          SLUG: ai-image-disclosure-labels

      - name: Verify package contents and versions
        shell: bash
        run: |
          set -euo pipefail

          test -f zipfile/ai-image-disclosure-labels.php
          test -f zipfile/readme.txt
          test ! -e zipfile/.github
          test ! -e zipfile/.wordpress-org

          plugin_version="$(awk -F: '/^[[:space:]]*\*[[:space:]]*Version:/ {gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print $2; exit}' zipfile/ai-image-disclosure-labels.php)"
          stable_tag="$(awk -F: '/^Stable tag:/ {gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print $2; exit}' zipfile/readme.txt)"

          test -n "$plugin_version"
          test -n "$stable_tag"
          test "$plugin_version" = "$stable_tag"

          echo "Plugin version: $plugin_version"
          echo "Stable tag: $stable_tag"

      - name: Run WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './zipfile'
          slug: 'ai-image-disclosure-labels'
